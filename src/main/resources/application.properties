spring.application.name=semanaUno

spring.datasource.url=${OS_DB_URL}
spring.datasource.username=${OS_DB_USERNAME}
spring.datasource.password=${OS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${azure.b2c.tenant-name}.b2clogin.com/tfp/${azure.b2c.tenant-id}/${azure.b2c.policy}/v2.0/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${azure.b2c.tenant-name}.b2clogin.com/${azure.b2c.tenant-name}.onmicrosoft.com/discovery/v2.0/keys?p=${azure.b2c.policy}

# Configuracion EFS
efs.path=/app/efs

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG